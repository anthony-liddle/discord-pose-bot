name: CI

# Actions are pinned to commit SHAs rather than tags. Tags can be moved, so a
# tag pin still trusts whoever controls the upstream repository. Update these
# deliberately, with the version noted in the trailing comment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Matches the Dockerfile, so CI exercises the runtime that ships.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Prettier otherwise only runs through lint-staged, which a --no-verify
      # commit skips.
      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
