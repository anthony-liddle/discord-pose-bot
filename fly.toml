# Fly.io configuration for the pose bot.
#
# This is a worker, not a website. It opens an outbound gateway connection to
# Discord and listens on no port.
#
# THERE MUST BE NO [http_service] AND NO [[services]] BLOCK. With a service
# defined, Fly's proxy treats the machine as idle when no HTTP requests arrive,
# and none ever will here, so it stops the machine a few minutes after start.
# Auto-start only fires on inbound HTTP, so the machine never comes back: the
# live timer dies with it, no expiry posts, and /pose answers "The application
# did not respond". With no services defined, Fly has nothing to idle and the
# machine runs continuously.
#
# `fly launch` adds that block back whenever it is allowed to rewrite this
# file, which is exactly what happened on the first deploy (2026-09-29). Create
# the app with `fly apps create` and deploy with `fly deploy`; never run
# `fly launch` in this repository. A test reads this file and fails if the
# block returns.
#
# There are no [[mounts]]. Nothing persists: timers live in memory and the pose
# list ships in the image.

app = 'discord-pose-bot'
primary_region = 'sjc'

[build]

[env]
  # Not a secret, so it lives here rather than in `fly secrets`.
  POSE_TIMEOUT_MINUTES = '5'
  # Log timestamps only. Deadlines are rendered by Discord in each reader's own
  # timezone, not from here.
  TZ = 'UTC'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

# Never run more than one machine. Two instances would both answer every /pose,
# so the member would get two poses and, five minutes later, two expiry
# messages. Deploy with `fly deploy --ha=false`, check with `fly status`, and
# correct with `fly scale count 1`.
